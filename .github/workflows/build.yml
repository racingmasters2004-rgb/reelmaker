name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Fetch speech engine, speech model and font
        run: |
          mkdir -p libs src/main/assets/whisper src/main/assets/fonts
          curl -fL -o libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          curl -fL -o model.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.en.tar.bz2
          tar xjf model.tar.bz2
          cp sherpa-onnx-whisper-base.en/base.en-encoder.int8.onnx src/main/assets/whisper/
          cp sherpa-onnx-whisper-base.en/base.en-decoder.int8.onnx src/main/assets/whisper/
          cp sherpa-onnx-whisper-base.en/base.en-tokens.txt src/main/assets/whisper/
          rm -rf sherpa-onnx-whisper-base.en model.tar.bz2
          curl -fL -o src/main/assets/fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf || echo "font download failed, app will use default font"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Reel Maker build ${{ github.run_number }}
          files: build/outputs/apk/debug/*.apk
